* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }

.layout { display: flex; height: 100vh; }

/* 左侧导航 */
.sidebar {
    width: 320px;
    min-width: 260px;
    background: #1e1e2e;
    color: #cdd6f4;
    overflow-y: auto;
    border-right: 1px solid #313244;
    display: flex;
    flex-direction: column;
}
.sidebar-header {
    padding: 18px 20px;
    background: #181825;
    border-bottom: 1px solid #313244;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: .5px;
    color: #f5c2e7;
}
.sidebar-header small {
    display: block;
    margin-top: 4px;
    font-weight: 400;
    font-size: 12px;
    color: #a6adc8;
}
.search-box {
    margin: 12px 14px 6px;
    padding: 8px 12px;
    background: #313244;
    border: 1px solid #45475a;
    border-radius: 6px;
    color: #cdd6f4;
    font-size: 13px;
    outline: none;
    width: calc(100% - 28px);
}
.search-box::placeholder { color: #6c7086; }
.search-box:focus { border-color: #89b4fa; }

.tree { padding: 8px 0; flex: 1; }
.tree ul { list-style: none; padding-left: 18px; }
.tree > ul { padding-left: 0; }
.tree li { line-height: 1.5; }
.tree .node {
    display: flex;
    align-items: center;
    padding: 4px 14px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    user-select: none;
    transition: background .15s;
}
.tree .node:hover { background: #313244; }
.tree .node.active { background: #45475a; color: #f9e2af; font-weight: 500; }
.tree .node .arrow {
    display: inline-block;
    width: 14px;
    font-size: 10px;
    color: #6c7086;
    transition: transform .15s;
    flex-shrink: 0;
}
.tree .node.collapsed .arrow { transform: rotate(-90deg); }
.tree .node .icon { margin-right: 6px; font-size: 13px; }
.tree .node.dir { color: #89b4fa; font-weight: 500; }
.tree .node.file { color: #cdd6f4; }
.tree .node.file.active { color: #f9e2af; }
.tree ul.hidden { display: none; }

/* 右侧内容 */
.content { flex: 1; background: #fff; }
.content iframe { width: 100%; height: 100%; border: 0; display: block; }
.welcome {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fafafa;
    color: #555;
}
.welcome h1 { color: #333; margin-bottom: 12px; font-size: 28px; }
.welcome p { font-size: 15px; color: #888; }

/* 滚动条 */
.sidebar::-webkit-scrollbar { width: 8px; }
.sidebar::-webkit-scrollbar-track { background: #1e1e2e; }
.sidebar::-webkit-scrollbar-thumb { background: #45475a; border-radius: 4px; }
.sidebar::-webkit-scrollbar-thumb:hover { background: #585b70; }
</style>

function buildTree(data, parent) {
    const ul = document.createElement('ul');
    data.forEach(item => {
        const li = document.createElement('li');
        
        if (item.children) {
            // 目录
            const node = document.createElement('div');
            node.className = 'node dir';
            node.innerHTML = `<span class="arrow">▼</span><span class="icon">📁</span><span class="label">${item.name}</span>`;
            node.onclick = (e) => {
                e.stopPropagation();
                const sub = node.nextElementSibling;
                if (sub.classList.contains('hidden')) {
                    sub.classList.remove('hidden');
                    node.classList.remove('collapsed');
                } else {
                    sub.classList.add('hidden');
                    node.classList.add('collapsed');
                }
            };
            li.appendChild(node);
            const childUl = buildTree(item.children, li);
            li.appendChild(childUl);
        } else {
            // 文件
            const node = document.createElement('div');
            node.className = 'node file';
            node.innerHTML = `<span class="arrow"></span><span class="icon">📄</span><span class="label">${item.name}</span>`;
            node.onclick = (e) => {
                e.stopPropagation();
                document.querySelectorAll('.node.active').forEach(n => n.classList.remove('active'));
                node.classList.add('active');
                const viewer = document.getElementById('viewer');
                viewer.removeAttribute('srcdoc');
                viewer.src = item.path;
            };
            li.appendChild(node);
        }
        ul.appendChild(li);
    });
    return ul;
}

document.addEventListener('DOMContentLoaded', () => {
    const tree = document.getElementById('tree');
    tree.appendChild(buildTree(TREE_DATA, tree));

    // 初始欢迎页（用 srcdoc，不影响后续 .src 赋值）
    document.getElementById('viewer').srcdoc =
        '<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;' +
        'background:#fafafa;color:#555;font-family:-apple-system,Segoe UI,PingFang SC,sans-serif;">' +
        '<h1 style="color:#333;margin-bottom:12px;font-size:28px;">👋 OEASY Vim 教程</h1>' +
        '<p style="font-size:15px;color:#888;">← 从左侧选择一个章节开始学习</p>' +
        '</div>';

    // 搜索
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        const allNodes = document.querySelectorAll('.node');
        allNodes.forEach(n => {
            const label = n.querySelector('.label').textContent.toLowerCase();
            const match = label.includes(q);
            n.style.display = match || !q ? '' : 'none';
            // 父目录展开
            if (match) {
                let p = n.parentElement;
                while (p) {
                    if (p.classList && p.classList.contains('hidden')) p.classList.remove('hidden');
                    const prev = p.previousElementSibling;
                    if (prev && prev.classList && prev.classList.contains('node')) {
                        prev.classList.remove('collapsed');
                    }
                    p = p.parentElement;
                }
            }
        });
    });
});
